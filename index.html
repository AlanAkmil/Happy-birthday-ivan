<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
<title>Galaxy Sahabat — Ivan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="galaxy.css" />
</head>
<body>

  <canvas id="scene"></canvas>

  <div class="vignette"></div>

  <div id="orbitLayer" class="orbit-layer"></div>

  <div class="hud" id="hud">
    <p class="eyebrow">a tiny galaxy, for my best friend</p>
    <h1 class="lover-name" id="loverName"></h1>
  </div>

  <button id="startBtn" class="start-core" aria-label="Open the surprise">
    <span class="core-ring"></span>
    <span class="core-ring delay1"></span>
    <span class="core-label">TAP</span>
  </button>

  <!-- ===== intro card: shown first, before zooming into the galaxy ===== -->
  <div class="intro-overlay" id="introOverlay">
    <div class="intro-card">
      <img class="intro-gif" src="friend-photo.jpg" alt="birthday card" loading="lazy" />
      <span class="intro-heart">✦</span>
      <p class="intro-kicker">HBD</p>
      <h2 class="intro-title">Galaxy of Friendship</h2>
      <p class="intro-sub">an invitation to a tiny universe made for you, Ivan</p>
      <button class="intro-btn" id="introBtn">
        <span>START</span>
        <span class="intro-btn-heart">✦</span>
      </button>
    </div>
  </div>

  <!-- ===== lightbox: view an orbit photo bigger when tapped ===== -->
  <div class="photo-lightbox" id="photoLightbox">
    <img id="photoLightboxImg" src="" alt="memory" />
  </div>

  <div id="flash" class="supernova-flash"></div>

  <script src="photos.js"></script>
  <script src="data.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="galaxy.js"></script>
</body>
</html>
